name: retail
version: "1.0.0"
config-version: 2
profile: retail
require-dbt-version: [">=1.11.0", "<1.12.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar bounds for dim_dates: covers the dataset (2009-12 -> 2011-12)
  # plus the 30-day revenue forecast horizon.
  calendar_start_date: "2009-12-01"
  calendar_end_date: "2012-12-31"

# Each layer lands in its own dataset: <target dataset>_<layer>
# prod -> retail_staging, retail_marts, ... ; dev -> retail_dev_staging, ...
models:
  retail:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
      +labels: {layer: staging}
    intermediate:
      +schema: intermediate
      +materialized: view
      +labels: {layer: intermediate}
    marts:
      +schema: marts
      +materialized: table
      +labels: {layer: marts}
      +contract: {enforced: true}
    reports:
      +schema: reports
      +materialized: table
      +labels: {layer: reports}
      +contract: {enforced: true}
    ml:
      +schema: ml
      +materialized: table
      +labels: {layer: ml}

seeds:
  retail:
    +schema: seeds
    +labels: {layer: seeds}
