# Apache Airflow (LocalExecutor) + Postgres metadata DB.
# Configuration and secrets come from .env (copy .env.example).
# Start with `make up`; Airflow UI on http://localhost:8088.
---
x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # Cosmos renders each dbt task group with `dbt ls` at parse time, which
    # takes longer than the 30s default.
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '200'
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: '200'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Put the project root on sys.path so `from include...` works in DAGs and
    # in external_python tasks.
    PYTHONPATH: /opt/airflow
    DBT_TARGET: prod
    GCP_KEYFILE_PATH: /opt/airflow/include/gcp/service_account.json
    AIRFLOW_CONN_GCP: >-
      {"conn_type": "google_cloud_platform",
       "extra": {"key_path": "/opt/airflow/include/gcp/service_account.json",
                 "project": "${GCP_PROJECT_ID}",
                 "scope": "https://www.googleapis.com/auth/cloud-platform"}}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    # Run as root only to fix the logs-volume ownership, then hand off to the
    # image /entrypoint which drops to the airflow user (uid 50000).
    # The admin user is recreated on each init so the password always matches .env.
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R 50000:0 /opt/airflow/logs
        exec /entrypoint bash -c 'airflow db migrate && { airflow users delete --username admin >/dev/null 2>&1 || true; } && airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}" --firstname admin --lastname admin --role Admin --email admin@example.com'
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
